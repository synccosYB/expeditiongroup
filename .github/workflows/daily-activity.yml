name: Daily activity validation
on:
  pull_request:
    paths:
      - 'client/src/components/daily-activity-dialog.tsx'
      - 'server/daily-activity.ts'
      - 'server/__tests__/daily-activity.test.ts'
      - 'server/routes.ts'
      - 'server/storage.ts'
      - 'shared/schema.ts'
      - 'package*.json'
      - '.github/workflows/daily-activity.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:daily-activity
      - run: npm run build
