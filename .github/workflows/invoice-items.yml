name: Invoice Items Validation
on:
  pull_request:
    paths:
      - 'client/src/components/invoice-*'
      - 'client/src/components/billing-items-manager.tsx'
      - 'client/src/components/manual-invoice-dialog.tsx'
      - 'client/src/pages/invoice-detail.tsx'
      - 'client/src/pages/client/invoice-detail.tsx'
      - 'client/src/pages/invoices.tsx'
      - 'client/src/lib/print*'
      - 'server/routes.ts'
      - 'shared/schema.ts'
      - 'migrations/**'
      - '.github/workflows/invoice-items.yml'
  push:
    branches: ['feat/invoice-items-compact-summary']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test client/src/components/invoice-compact-items.test.ts client/src/lib/printAssets.test.ts
      - run: npm run build
      - name: TypeScript baseline audit
        shell: bash
        run: |
          set +e
          npm run check > /tmp/tsc-output.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::warning::Repository-wide TypeScript check has pre-existing errors; inspect logged errors."
            grep -E '^(client/src/components/(invoice-compact-items|invoice-generation-dialog|manual-invoice-dialog|billing-items-manager)\.tsx|client/src/pages/(invoice-detail|invoices|client/invoice-detail)\.tsx|client/src/lib/print(Assets|Utils)\.ts)\(' /tmp/tsc-output.log > /tmp/invoice-errors.log || true
            if [ -s /tmp/invoice-errors.log ]; then cat /tmp/invoice-errors.log; exit 1; fi
            echo "No TypeScript errors reported in invoice UI or print helper files."
          else
            echo "Repository-wide TypeScript check passed."
          fi
